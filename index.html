<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Autonomous Research Assistant Portal</title>
    <!-- Official n8n Chat CSS Assets -->
    <link href="https://jsdelivr.net" rel="stylesheet" />
</head>
<body>

    <script type="module">
        import { createChat } from 'https://jsdelivr.net';

        createChat({
            webhookUrl: 'https://n8n.cloud',
            mode: 'window', // Uses standard built-in overlay sizing
            title: 'Autonomous AI Research Assistant',
            subtitle: 'Powered by n8n Workflows + Tavily Search + Groq LLM',
            placeholder: 'Type any research topic...',
            showWelcomeScreen: true,
            welcomeScreenTitle: 'Welcome to your AI Research Agent Portal',
            welcomeScreenSubtitle: 'I will scan live web data, compile resources, and output a structured analysis report for you.',
        });
    </script>

</body>
</html>
