<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Autonomous Research Assistant Portal</title>
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #0052cc;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .badge {
            background-color: #e3efff;
            color: #0052cc;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Assignment 13.5 Deployment</div>
        <h1>Autonomous AI Research Agent</h1>
        <p>Welcome to the production portal. Click the chat launcher bubble in the bottom right corner of your screen to research any topic autonomously using live web search integration.</p>
    </div>

    <!-- n8n Interactive Live Chat Widget Embed Code -->
    <script type="module">
        import { createChat } from 'https://jsdelivr.net';

        createChat({
            webhookUrl: 'https://aarav-sri.app.n8n.cloud/webhook/44cdb699-aeb9-4a87-ae07-7663f024586a/chat',
            mode: 'window',
            title: 'AI Research Assistant',
            subtitle: 'Powered by n8n + Tavily + Groq',
            placeholder: 'Type a research topic (e.g., Quantum Computing Trends 2026)...',
            showWelcomeScreen: true,
            welcomeScreenTitle: 'Welcome to your AI Research Agent',
            welcomeScreenSubtitle: 'I will scan the live web and compile a production-ready HTML report for you.',
        });
    </script>

</body>
</html>
