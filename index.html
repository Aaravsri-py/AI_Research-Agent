<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Autonomous Research Assistant Portal</title>
    <!-- Importing n8n official Chat Style Assets -->
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
        }
    </style>
</head>
<body>

    <!-- This script automatically embeds the full workspace chat layout across your entire page view -->
    <script type="module">
        import { createChat } from 'https://jsdelivr.net';

        createChat({
            webhookUrl: 'https://n8n.cloud',
            mode: 'fullscreen', // This forces the full working chat model to display instantly on your site
            title: 'Autonomous AI Research Assistant',
            subtitle: 'Powered by n8n Workflows + Tavily Search + Groq LLM',
            placeholder: 'Type any research topic (e.g., Quantum Computing Trends 2026)...',
            showWelcomeScreen: true,
            welcomeScreenTitle: 'Welcome to your AI Research Agent Portal',
            welcomeScreenSubtitle: 'I will scan live web data, compile resources, and output a structured analysis report for you.',
        });
    </script>

</body>
</html>
